<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Iron Progress</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .profile-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .profile-header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 auto 16px;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .profile-email {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }

        .settings-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 16px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .setting-row:last-child {
            border-bottom: none;
        }

        .setting-label {
            font-size: 0.9rem;
            color: var(--color-text-primary);
        }

        .setting-input {
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.875rem;
            width: 120px;
            text-align: right;
        }

        .setting-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .setting-select {
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.875rem;
            min-width: 140px;
        }

        .workout-mode-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .mode-option {
            padding: 16px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-option:hover {
            border-color: rgba(102, 126, 234, 0.5);
        }

        .mode-option.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .mode-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .mode-name {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .save-btn:hover {
            transform: scale(1.02);
        }

        .footer-section {
            margin-top: auto;
            padding-top: 20px;
        }

        .back-btn {
            display: block;
            text-align: center;
            padding: 12px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .logout-btn {
            width: 100%;
            padding: 14px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .saved-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4ade80;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar" id="profile-avatar">U</div>
            <div class="profile-name" id="profile-name">User</div>
            <div class="profile-email" id="profile-email">user@example.com</div>
        </div>

        <!-- Body Measurements -->
        <div class="settings-section">
            <div class="section-title">📏 Body Measurements</div>
            <div class="setting-row">
                <span class="setting-label">Height</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="number" id="height-ft" class="setting-input" style="width: 50px;" placeholder="5"
                        min="3" max="8">
                    <span>ft</span>
                    <input type="number" id="height-in" class="setting-input" style="width: 50px;" placeholder="10"
                        min="0" max="11">
                    <span>in</span>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label">Body Weight</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="number" id="body-weight" class="setting-input" placeholder="150" min="50" max="500">
                    <span>lbs</span>
                </div>
            </div>
        </div>

        <!-- Workout Preferences -->
        <div class="settings-section">
            <div class="section-title">🎯 Workout Goal</div>
            <div class="workout-mode-grid">
                <div class="mode-option" data-mode="muscle" onclick="selectMode('muscle')">
                    <div class="mode-icon">💪</div>
                    <div class="mode-name">Build Muscle</div>
                </div>
                <div class="mode-option" data-mode="fit" onclick="selectMode('fit')">
                    <div class="mode-icon">🏃</div>
                    <div class="mode-name">Stay Fit</div>
                </div>
                <div class="mode-option" data-mode="cardio" onclick="selectMode('cardio')">
                    <div class="mode-icon">❤️</div>
                    <div class="mode-name">Cardio</div>
                </div>
            </div>
        </div>

        <!-- Weekly Schedule -->
        <div class="settings-section">
            <div class="section-title">📅 Weekly Schedule</div>
            <div class="setting-row">
                <span class="setting-label">Workouts per week</span>
                <select id="weekly-frequency" class="setting-select">
                    <option value="2">2 times</option>
                    <option value="3">3 times</option>
                    <option value="4" selected>4 times</option>
                    <option value="5">5 times</option>
                    <option value="6">6 times</option>
                    <option value="7">Every day</option>
                </select>
            </div>
            <div class="setting-row">
                <span class="setting-label">Rest days between same muscle</span>
                <select id="rest-days" class="setting-select">
                    <option value="1">1 day</option>
                    <option value="2" selected>2 days</option>
                    <option value="3">3 days</option>
                </select>
            </div>
        </div>

        <button class="save-btn" onclick="saveProfile()">
            💾 Save Profile
        </button>

        <div class="footer-section">
            <a href="index.html" class="back-btn">← Back to Workouts</a>
            <button class="logout-btn" onclick="logout()">
                🚪 Log Out
            </button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        let selectedMode = 'muscle';

        function getUserStorageKey(baseKey) {
            const storedUser = localStorage.getItem('ironProgressUser');
            if (storedUser) {
                const user = JSON.parse(storedUser);
                const uniqueId = user.uid || user.email || 'anonymous';
                return `${baseKey}_${uniqueId}`;
            }
            return `${baseKey}_anonymous`;
        }

        function loadProfile() {
            const user = JSON.parse(localStorage.getItem('ironProgressUser'));
            if (!user) {
                window.location.href = 'landing.html';
                return;
            }

            // Set user info
            document.getElementById('profile-name').textContent = user.displayName || 'User';
            document.getElementById('profile-email').textContent = user.email || '';
            document.getElementById('profile-avatar').textContent = (user.displayName || 'U')[0].toUpperCase();

            // Load saved profile
            const stored = localStorage.getItem(getUserStorageKey('userProfile'));
            if (stored) {
                const profile = JSON.parse(stored);
                document.getElementById('height-ft').value = profile.heightFt || '';
                document.getElementById('height-in').value = profile.heightIn || '';
                document.getElementById('body-weight').value = profile.bodyWeight || '';
                document.getElementById('weekly-frequency').value = profile.weeklyFrequency || '4';
                document.getElementById('rest-days').value = profile.restDays || '2';
                selectMode(profile.workoutMode || 'muscle');
            }
        }

        function selectMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('.mode-option').forEach(el => {
                el.classList.remove('selected');
            });
            document.querySelector(`[data-mode="${mode}"]`).classList.add('selected');
        }

        function saveProfile() {
            const profile = {
                heightFt: parseInt(document.getElementById('height-ft').value) || null,
                heightIn: parseInt(document.getElementById('height-in').value) || null,
                bodyWeight: parseFloat(document.getElementById('body-weight').value) || null,
                workoutMode: selectedMode,
                weeklyFrequency: parseInt(document.getElementById('weekly-frequency').value),
                restDays: parseInt(document.getElementById('rest-days').value)
            };

            localStorage.setItem(getUserStorageKey('userProfile'), JSON.stringify(profile));

            // Show toast
            const toast = document.createElement('div');
            toast.className = 'saved-toast';
            toast.textContent = '✓ Profile Saved!';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function logout() {
            localStorage.removeItem('ironProgressUser');
            window.location.href = 'landing.html';
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>

</html>
